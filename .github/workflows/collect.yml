name: Collect intelligence sources

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "忽略来源频次，立即全量采集"
        required: false
        default: true
        type: boolean
  push:
    branches:
      - main
    paths:
      - "config/sources.json"
      - "scripts/collect.py"
      - ".github/workflows/collect.yml"

permissions:
  contents: read

concurrency:
  group: monthly-know-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect configured sources
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FORCE_COLLECT: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
        run: python scripts/collect.py
